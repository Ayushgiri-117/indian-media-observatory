[project]
name = "observatory"
version = "0.1.0"
description = "Indian Media Observatory — Ownership Graph & News Archive (v0)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["observatory*"]
